name: Deploy to staging

on:
push:
branches:
- main

jobs:
redeploy_everything:
runs-on: ubuntu-latest
name: Deploying everything to the staging cluster

```
steps:
  - name: Deploy to EC2 via SSH
    run: |
      echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/ssh_key
      chmod 600 ~/ssh_key

      ssh -o StrictHostKeyChecking=no -i ~/ssh_key ubuntu@13.49.18.127 << 'EOF'
        cd ~/turborepo-project

        # Make server match GitHub exactly
        git fetch origin
        git reset --hard origin/main

        # Ensure pnpm and pm2 are installed
        npm install -g pnpm pm2

        # Install dependencies and build
        pnpm install --frozen-lockfile
        pnpm run build

        # Restart services
        pm2 restart http-server || true
        pm2 restart fe-server || true
        pm2 restart ws-server || true
      EOF
```
