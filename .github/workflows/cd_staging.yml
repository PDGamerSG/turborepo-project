name: Deploy to staging
on:
push:
branches: [ main ]

jobs:
redeploy_everything:
runs-on: ubuntu-latest
name: Deploying everything to the staging cluster
steps:
- run: |
echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/ssh_key
mkdir -p /home/runner/.ssh
ls /home/runner/.ssh
touch /home/runner/.ssh/known_hosts
echo "${{ secrets.KNOWN_HOSTS }}" > /home/runner/.ssh/known_hosts
chmod 600 ~/ssh_key
ssh -o StrictHostKeyChecking=no -i ~/ssh_key root@64.227.147.124 -t "cd week-25-ci-next-app/ && git fetch origin && git reset --hard origin/main && export PATH=/root/.nvm/versions/node/v22.13.1/bin:$PATH && npm install -g pnpm pm2 && pnpm install && pnpm run build && pm2 restart fe-server && pm2 restart http-server && pm2 restart ws-server"
